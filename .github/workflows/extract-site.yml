name: Extract website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract website files
        run: |
          mkdir -p /tmp/primary-math-site
          unzip -q primary_math_firebase_padlet_embedded.zip -d /tmp/primary-math-site
          cp -a /tmp/primary-math-site/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract primary math website files"
            git push origin HEAD:main
          fi
